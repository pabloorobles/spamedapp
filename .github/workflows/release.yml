# Compila Spamed Travel para Windows y publica el resultado como Release.
#
# Por que existe: la app es un .exe de Windows (PyInstaller + Inno Setup) y
# no se puede compilar en Linux ni en el entorno de Claude Code. Este
# workflow usa un runner Windows de GitHub, asi que el instalador se arma
# solo y queda descargable desde la pestana Releases del repo.
#
# Se dispara de tres formas:
#   - al empujar un tag que empiece con "v" (ej: v1.1.0);
#   - al empujar a main;
#   - a mano desde Actions -> "Run workflow".
#
# En los tres casos compila y deja los archivos como artifact. Ademas
# PUBLICA el Release cuando la version de config.py todavia no tiene uno:
# o sea, subir el numero de version es lo que dispara una publicacion. Si
# el Release ya existe no se toca nada, asi que empujar mil veces a main no
# republica ni pisa un instalador ya descargado.
#
# Solo dispara desde main a proposito: publicar desde una rama sin mergear
# dejaria un Release de codigo que no esta en la rama principal.
#
# El tag lo crea este workflow (gh release create lo genera apuntando al
# commit que se compilo). No hace falta crearlo a mano.
#
# La version sale del tag cuando el disparador es un tag, y de
# src/spamed/core/config.py en los demas casos. Tiene que coincidir con
# build/version_info.txt y con MiVersion de build/installer.iss: el paso
# "Verificar que la version coincide" corta la compilacion si no, para no
# publicar un instalador mal rotulado.

name: Release de Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.11 (64 bits)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # Sin este paso, un SyntaxError aparece mas tarde como un
      # "invalid module" de PyInstaller, sin decir la causa real.
      - name: Verificar sintaxis (compileall)
        run: python -m compileall -q src

      - name: Pruebas de negocio
        run: python -u tests/test_negocio.py

      # Las pruebas de interfaz (tests/test_interfaz.py) no corren aca a
      # proposito: necesitan QtWebEngine renderizando, y un runner sin GPU no
      # puede hacerlo (esta documentado en MIGRACION_WEB.md, etapa 1). Se
      # corren en la PC de desarrollo.

      - name: Averiguar la version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = $tag -replace '^v', ''
          } else {
            $version = (Select-String -Path src/spamed/core/config.py `
              -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          echo "numero=$version" >> $env:GITHUB_OUTPUT
          echo "Version a compilar: $version"

      - name: Verificar que la version coincide en los tres lugares
        shell: pwsh
        run: |
          $esperada = "${{ steps.version.outputs.numero }}"
          $fallos = @()

          $enConfig = (Select-String -Path src/spamed/core/config.py `
            -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($enConfig -ne $esperada) {
            $fallos += "config.py dice $enConfig"
          }

          $enIss = (Select-String -Path build/installer.iss `
            -Pattern '#define\s+MiVersion\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ($enIss -ne $esperada) {
            $fallos += "installer.iss dice $enIss"
          }

          $enVer = (Select-String -Path build/version_info.txt `
            -Pattern "StringStruct\('ProductVersion',\s*'([^']+)'\)").Matches[0].Groups[1].Value
          if ($enVer -ne $esperada) {
            $fallos += "version_info.txt dice $enVer"
          }

          if ($fallos.Count -gt 0) {
            Write-Host "::error::Se esperaba la version $esperada pero: $($fallos -join '; ')"
            exit 1
          }
          Write-Host "Version $esperada consistente en los tres archivos."

      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm --clean build/spamed.spec

      - name: Revisar el bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SpamedTravel/SpamedTravel.exe")) {
            Write-Host "::error::PyInstaller no dejo el .exe."
            exit 1
          }
          # Si el paquete se materializa como carpeta real adentro del
          # bundle, le compite al paquete empaquetado y el .exe no importa
          # sus propios modulos. Ya paso una vez (ver CLAUDE.md).
          if (Test-Path "dist/SpamedTravel/_internal/spamed") {
            Write-Host "::error::Quedo _internal/spamed en el bundle. Revisar build/spamed.spec."
            exit 1
          }
          # Las pantallas web son diez de las once: sin esta carpeta la app
          # compila pero arranca en blanco.
          if (-not (Test-Path "dist/SpamedTravel/_internal/recursos/web/inicio/index.html")) {
            Write-Host "::error::Falta recursos/web/ en el bundle."
            exit 1
          }
          $tam = [math]::Round((Get-ChildItem dist/SpamedTravel -Recurse |
                 Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Bundle OK. Tamano: $tam MB"

      - name: Armar el zip portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/publicar | Out-Null
          Compress-Archive -Path dist/SpamedTravel/* `
            -DestinationPath "dist/publicar/SpamedTravel_${{ steps.version.outputs.numero }}_portable.zip" `
            -Force

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Armar el instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build/installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "dist/instalador/SpamedTravel_Setup_${{ steps.version.outputs.numero }}.exe" `
            -Destination dist/publicar/

      - name: Guardar los archivos como artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpamedTravel-${{ steps.version.outputs.numero }}-windows
          path: dist/publicar/*
          retention-days: 30

      - name: Publicar el Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.numero }}"
          $tag = "v$v"

          # Si ya hay un Release para esta version no se toca: republicar
          # pisaria un instalador que alguien pudo haber bajado ya.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "El Release $tag ya existe. No se publica nada."
            Write-Host "Para publicar uno nuevo, subir la version en config.py, version_info.txt e installer.iss."
            exit 0
          }

          # Las notas viven en .github/NOTAS_RELEASE.md con __VERSION__ como
          # marcador, para no tener texto largo embebido en el YAML.
          (Get-Content .github/NOTAS_RELEASE.md -Raw) -replace '__VERSION__', $v |
            Set-Content notas_release.md -Encoding utf8

          $archivos = Get-ChildItem dist/publicar/* | ForEach-Object { $_.FullName }

          # --target hace que gh cree el tag apuntando al commit compilado
          # si todavia no existe.
          gh release create $tag @archivos `
            --title "Spamed Travel $v" `
            --notes-file notas_release.md `
            --target $env:GITHUB_SHA
          Write-Host "Release $tag publicado."
