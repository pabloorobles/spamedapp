<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vendedores</title>
<link rel="stylesheet" href="spamed://app/comun/tokens.css">
<link rel="stylesheet" href="spamed://app/comun/base.css">
<link rel="stylesheet" href="spamed://app/vendedores/vendedores.css">
</head>
<body>
  <div class="cab">
    <div>
      <h1>Vendedores</h1>
      <div class="cab__bajada" id="bajada">Cargando…</div>
    </div>
    <div class="cab__acciones">
      <button class="btn btn-suave" id="btnDocumentacion" type="button" disabled>Documentación</button>
      <button class="btn btn-primario" id="btnNuevo" type="button">Nuevo</button>
    </div>
  </div>

  <div class="filtros">
    <input class="campo campo--ancho" type="search" id="fBusqueda" placeholder="Buscar vendedores...">
    <label class="check"><input type="checkbox" id="fActivos"> Solo activos</label>
  </div>

  <div class="panel">
    <div class="acciones">
      <button class="btn btn-suave" id="btnEditar" type="button" disabled>Editar</button>
      <span class="acciones__espacio"></span>
      <button class="btn btn-suave" id="btnEliminar" type="button" disabled>Eliminar</button>
      <button class="btn btn-suave" id="btnExportar" type="button">Exportar</button>
    </div>
    <div class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>Apellido</th><th>Nombre</th><th>DNI</th><th>Teléfono</th>
            <th>Email</th><th>Cumpleaños</th><th class="num">Comisión</th>
            <th class="num">Files</th><th>Última venta</th>
            <th class="num">Ganancia generada</th><th>Alertas</th><th>Activo</th>
          </tr>
        </thead>
        <tbody id="tablaVendedores"></tbody>
      </table>
    </div>
  </div>

  <!-- -------------------------------------------------- modal vendedor -->
  <div class="overlay" id="modalVendedor" hidden>
    <form class="modal" id="formVendedor">
      <h2 id="tituloVendedor">Vendedor</h2>
      <div class="modal__error" id="errorVendedor" hidden></div>

      <label for="vDni">DNI *</label>
      <input class="campo" id="vDni" required>
      <label for="vApellido">Apellido *</label>
      <input class="campo" id="vApellido" required>
      <label for="vNombre">Nombre *</label>
      <input class="campo" id="vNombre" required>
      <label for="vTelefono">Teléfono</label>
      <input class="campo" id="vTelefono">
      <label for="vEmail">Email</label>
      <input class="campo" type="email" id="vEmail">
      <label for="vFechaNac">Cumpleaños</label>
      <input class="campo" type="date" id="vFechaNac">
      <label for="vComision">Comisión (%)</label>
      <input class="campo" type="number" id="vComision" min="0" max="100" step="0.01" value="0">
      <label class="check"><input type="checkbox" id="vActivo" checked> Activo</label>

      <div class="modal__acciones">
        <button type="button" class="btn btn-suave" id="btnCancelarVendedor">Cancelar</button>
        <button type="submit" class="btn btn-primario">Guardar</button>
      </div>
    </form>
  </div>

  <script src="spamed://app/comun/qwebchannel.js"></script>
  <script src="spamed://app/comun/util.js"></script>
  <script src="spamed://app/vendedores/vendedores.js"></script>
</body>
</html>
