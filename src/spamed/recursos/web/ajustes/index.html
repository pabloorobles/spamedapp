<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustes</title>
<link rel="stylesheet" href="spamed://app/comun/tokens.css">
<link rel="stylesheet" href="spamed://app/comun/base.css">
<link rel="stylesheet" href="spamed://app/ajustes/ajustes.css">
</head>
<body>
  <div class="cab">
    <div>
      <h1>Ajustes</h1>
      <div class="cab__bajada">Listas desplegables</div>
    </div>
  </div>

  <div class="modal__nota" style="margin:0 0 16px">
    Estos son los valores que aparecen en los menús desplegables de toda la aplicación.
    Agregá los que uses y sacá los que no, así las cargas son más rápidas y sin errores de tipeo.
  </div>

  <div class="filtros">
    <label for="selLista">Lista</label>
    <select class="campo campo--ancho" id="selLista"></select>
    <button class="btn btn-primario" id="btnAgregar" type="button">Agregar valor</button>
    <button class="btn btn-suave" id="btnRenombrar" type="button" disabled>Renombrar</button>
    <button class="btn btn-suave" id="btnQuitar" type="button" disabled>Quitar</button>
  </div>

  <div class="panel" style="padding:0; overflow:hidden">
    <div class="tabla-wrap">
      <table>
        <thead><tr><th>Valor</th><th style="width:120px"></th></tr></thead>
        <tbody id="tablaListas"></tbody>
      </table>
    </div>
  </div>
  <div class="modal__nota">
    Usá las flechas para cambiar el orden en que aparecen en los desplegables.
  </div>

  <script src="spamed://app/comun/qwebchannel.js"></script>
  <script src="spamed://app/ajustes/ajustes.js"></script>
</body>
</html>
